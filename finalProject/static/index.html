
<!--
    Prolog Database Search Web Interface

    This HTML document provides a web interface for searching a Prolog database.
    It includes a search form with filters for name, age and gender, and displays
    results in a table format.

    Components:
    - Search Form: Allows filtering by:
        * Name (text input)
        * Age (number input) 
        * Gender (dropdown select - male/female)
    
    - Results Table: Displays search results with columns for:
        * Name
        * Age 
        * Gender

    - Status Messages: Shows error messages if search fails

    JavaScript Functionality:
    - Form submission handler using async/await
    - Fetches data from '/api/search' endpoint with query parameters
    - Dynamically renders results in table format
    - Handles both successful searches and error cases
    - Uses URLSearchParams for query string building

    External Dependencies:
    - Custom styles from styles.css
-->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My store</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <h1>My store</h1>

            <!-- Search Form -->
            <form id="searchForm">
                <input type="text" id="searchName" placeholder="Search by name" name="name">
                <input type="number" id="searchAge" placeholder="Search by price" name="age">
                <select id="searchGender" name="gender">
                    <option value="">Select category</option>
                    <option value="Food">Food</option>
                    <option value="Cleaning">Cleaning</option>
                </select>
                <button type="submit">Search</button>
            </form>

            <!-- Add this after your search form in index.html -->
            <div class="add-product-section">
                <h2>Add New Product</h2>
                <form id="addProductForm">
                    <input type="text" id="productName" placeholder="Product name" required>
                    <input type="number" id="productPrice" placeholder="Price" required>
                    <select id="productCategory" required>
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Cleaning">Cleaning</option>
                    </select>
                    <button type="submit">Add Product</button>
                </form>
            </div>

            <div class="results-container">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Category</th>
                        </tr>
                    </thead>
                    <tbody id="resultsList">
                        <!-- Results will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>

            <!-- Status Messages -->
            <div id="status"></div>
        </div>

        <script src="search.js"></script>
    </body>
</html>
