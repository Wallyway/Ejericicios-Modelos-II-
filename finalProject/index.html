<!--
    Prolog Database Search Web Interface

    This HTML document provides a web interface for searching a Prolog database.
    It includes a search form with filters for name, age and gender, and displays
    results in a table format.

    Components:
    - Search Form: Allows filtering by:
        * Name (text input)
        * Age (number input) 
        * Gender (dropdown select - male/female)
    
    - Results Table: Displays search results with columns for:
        * Name
        * Age 
        * Gender

    - Status Messages: Shows error messages if search fails

    JavaScript Functionality:
    - Form submission handler using async/await
    - Fetches data from '/api/search' endpoint with query parameters
    - Dynamically renders results in table format
    - Handles both successful searches and error cases
    - Uses URLSearchParams for query string building

    External Dependencies:
    - Custom styles from styles.css
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prolog Database Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Prolog Database Search</h1>

        <!-- Search Form -->
        <form id="searchForm">
            <input type="text" id="searchName" placeholder="Search by name" name="name">
            <input type="number" id="searchAge" placeholder="Search by age" name="age">
            <select id="searchGender" name="gender">
                <option value="">Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <button type="submit">Search</button>
        </form>

        <div class="results-container">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                    </tr>
                </thead>
                <tbody id="resultsList">
                    <!-- Results will be dynamically inserted here -->
                </tbody>
            </table>
        </div>

        <!-- Status Messages -->
        <div id="status"></div>
    </div>

    <script>
        // Search form handler
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('searchName').value;
            const age = document.getElementById('searchAge').value;
            const gender = document.getElementById('searchGender').value;
    
            let searchParams = new URLSearchParams();
            if (name) searchParams.append('name', name);
            if (age) searchParams.append('age', age);
            if (gender) searchParams.append('gender', gender);
    
            try {
                const response = await fetch(`/api/search?${searchParams}`);
                if (!response.ok) throw new Error('Search failed');
                const data = await response.json();
                const resultsList = document.getElementById('resultsList');
                resultsList.innerHTML = '';
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(person => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${person.name}</td>
                            <td>${person.age}</td>
                            <td>${person.gender}</td>
                        `;
                        resultsList.appendChild(row);
                    });
                } else {
                    resultsList.innerHTML = '<tr><td colspan="3">No results found</td></tr>';
                }
            } catch (error) {
                document.getElementById('status').innerHTML = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
